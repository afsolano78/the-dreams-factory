<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Panel · The Dreams Factory</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!--
      Panel de edición (Sveltia CMS) para las bodas y el blog. La configuración está en config.yml; aquí solo se le
      dice en qué dirección está la web, para que el inicio de sesión (worker/cms-auth.ts) funcione igual en el
      prototipo y en el dominio definitivo. Guía para Bea y Vane: web/PANEL.md.
    -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/@sveltia/cms@0.248.0/dist/sveltia-cms.js"></script>
    <script>
      CMS.init({
        config: {
          backend: { base_url: location.origin },
          site_url: location.origin,
          display_url: location.origin,
        },
      });
    </script>
  </body>
</html>
